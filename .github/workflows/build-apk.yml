name: Build Alblozy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: إنشاء مشروع Android
        run: |
          mkdir -p app/src/main/java/com/alblozy/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/index.html
          cp MainActivity.java app/src/main/java/com/alblozy/app/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp styles.xml app/src/main/res/values/styles.xml
          cp ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name='AlblozyAndroid'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.alblozy.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.alblozy.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 72
                  versionName '72.0'
              }
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties

      - name: إنشاء Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7

      - name: بناء APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: Alblozy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
